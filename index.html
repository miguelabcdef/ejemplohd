<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Wormhole Cosmic Travel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <script>
        window.onload = function () {
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020008, 0.0035);

            const camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            function createGlowTexture(colorInner, colorOuter) {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');

                const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                gradient.addColorStop(0, colorInner);
                gradient.addColorStop(0.3, colorOuter);
                gradient.addColorStop(0.7, 'rgba(20, 10, 40, 0.15)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 128, 128);

                return new THREE.CanvasTexture(canvas);
            }

            const starTexture = createGlowTexture('rgba(255, 255, 255, 1)', 'rgba(180, 220, 255, 0.8)');
            const nebulaTexture1 = createGlowTexture('rgba(255, 60, 180, 0.9)', 'rgba(120, 0, 255, 0.4)');
            const nebulaTexture2 = createGlowTexture('rgba(0, 220, 255, 0.9)', 'rgba(0, 50, 200, 0.4)');
            const goldTexture = createGlowTexture('rgba(255, 200, 80, 1)', 'rgba(255, 100, 0, 0.5)');

            const tunnelSegments = 300;
            const tunnelLength = 800;
            
            // Create a curved path using CatmullRomCurve3
            const curvePoints = [];
            for (let i = 0; i < 20; i++) {
                const z = -i * (tunnelLength / 20);
                const x = Math.sin(i * 0.5) * 45;
                const y = Math.cos(i * 0.3) * 35;
                curvePoints.push(new THREE.Vector3(x, y, z));
            }
            const tunnelPath = new THREE.CatmullRomCurve3(curvePoints);
            tunnelPath.closed = false;

            const tunnelGeometry = new THREE.TubeGeometry(tunnelPath, tunnelSegments, 22, 24, false);
            
            // Create Tunnel Wireframe/Energy Mesh
            const tunnelMaterial = new THREE.MeshBasicMaterial({
                color: 0x4411aa,
                wireframe: true,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending
            });
            const tunnelMesh = new THREE.Mesh(tunnelGeometry, tunnelMaterial);
            scene.add(tunnelMesh);

            const tunnelParticleCount = 110000;
            const particleGeo = new THREE.BufferGeometry();
            const particlePos = new Float32Array(tunnelParticleCount * 3);
            const particleColors = new Float32Array(tunnelParticleCount * 3);
            const particleSizes = new Float32Array(tunnelParticleCount);

            const palette = [
                new THREE.Color('#00ffff'), // Cyan
                new THREE.Color('#ff00aa'), // Magenta
                new THREE.Color('#7700ff'), // Purple
                new THREE.Color('#0066ff'), // Blue
                new THREE.Color('#ffbb33'), // Gold
                new THREE.Color('#ffffff')  // Pure White
            ];

            for (let i = 0; i < tunnelParticleCount; i++) {
                const i3 = i * 3;
                
                // Distribute particles along the tunnel tube path
                const u = Math.random();
                const pointOnCurve = tunnelPath.getPointAt(u);
                
                // Angle around the tunnel cylinder
                const angle = Math.random() * Math.PI * 2;
                // Varying radius for thick dense cosmic dust walls
                const radius = 8 + Math.pow(Math.random(), 1.5) * 26;

                // Tangent vector for perpendicular positioning
                const tangent = tunnelPath.getTangentAt(u);
                const normal = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
                const binormal = tangent.clone().cross(normal).normalize();

                const x = pointOnCurve.x + (Math.cos(angle) * normal.x + Math.sin(angle) * binormal.x) * radius;
                const y = pointOnCurve.y + (Math.cos(angle) * normal.y + Math.sin(angle) * binormal.y) * radius;
                const z = pointOnCurve.z + (Math.cos(angle) * normal.z + Math.sin(angle) * binormal.z) * radius;

                particlePos[i3] = x;
                particlePos[i3 + 1] = y;
                particlePos[i3 + 2] = z;

                // Color distribution
                const cIdx = Math.floor(Math.random() * palette.length);
                const col = palette[cIdx].clone();
                col.r += (Math.random() - 0.5) * 0.1;
                col.g += (Math.random() - 0.5) * 0.1;
                col.b += (Math.random() - 0.5) * 0.1;

                particleColors[i3] = col.r;
                particleColors[i3 + 1] = col.g;
                particleColors[i3 + 2] = col.b;

                particleSizes[i] = Math.random() * 0.6 + 0.15;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.35,
                vertexColors: true,
                map: starTexture,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const tunnelParticles = new THREE.Points(particleGeo, particleMat);
            scene.add(tunnelParticles);

            const nebulaCount = 1800;
            const nebulaGeo = new THREE.BufferGeometry();
            const nebulaPos = new Float32Array(nebulaCount * 3);
            const nebulaColors = new Float32Array(nebulaCount * 3);

            for (let i = 0; i < nebulaCount; i++) {
                const i3 = i * 3;
                const u = Math.random();
                const pointOnCurve = tunnelPath.getPointAt(u);
                const angle = Math.random() * Math.PI * 2;
                const radius = 10 + Math.random() * 20;

                const tangent = tunnelPath.getTangentAt(u);
                const normal = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
                const binormal = tangent.clone().cross(normal).normalize();

                nebulaPos[i3] = pointOnCurve.x + (Math.cos(angle) * normal.x + Math.sin(angle) * binormal.x) * radius;
                nebulaPos[i3 + 1] = pointOnCurve.y + (Math.cos(angle) * normal.y + Math.sin(angle) * binormal.y) * radius;
                nebulaPos[i3 + 2] = pointOnCurve.z + (Math.cos(angle) * normal.z + Math.sin(angle) * binormal.z) * radius;

                const col = (Math.random() < 0.5) ? new THREE.Color('#ff00bb') : new THREE.Color('#00ccff');
                nebulaColors[i3] = col.r;
                nebulaColors[i3 + 1] = col.g;
                nebulaColors[i3 + 2] = col.b;
            }

            nebulaGeo.setAttribute('position', new THREE.BufferAttribute(nebulaPos, 3));
            nebulaGeo.setAttribute('color', new THREE.BufferAttribute(nebulaColors, 3));

            const nebulaMat = new THREE.PointsMaterial({
                size: 6.5,
                vertexColors: true,
                map: nebulaTexture1,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const nebulaClouds = new THREE.Points(nebulaGeo, nebulaMat);
            scene.add(nebulaClouds);

            const galaxyGroup = new THREE.Group();
            
            function createMiniGalaxy(color1, color2) {
                const count = 4000;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                const col = new Float32Array(count * 3);

                const c1 = new THREE.Color(color1);
                const c2 = new THREE.Color(color2);

                for (let i = 0; i < count; i++) {
                    const i3 = i * 3;
                    const r = Math.pow(Math.random(), 1.5) * 15;
                    const theta = Math.random() * Math.PI * 2 * 3;
                    const armOffset = (i % 2) * Math.PI;

                    const x = Math.cos(theta + armOffset) * r + (Math.random() - 0.5) * 1.5;
                    const y = (Math.random() - 0.5) * 1.2;
                    const z = Math.sin(theta + armOffset) * r + (Math.random() - 0.5) * 1.5;

                    pos[i3] = x;
                    pos[i3 + 1] = y;
                    pos[i3 + 2] = z;

                    const mixed = c1.clone().lerp(c2, r / 15);
                    col[i3] = mixed.r;
                    col[i3 + 1] = mixed.g;
                    col[i3 + 2] = mixed.b;
                }

                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.25,
                    vertexColors: true,
                    map: starTexture,
                    transparent: true,
                    opacity: 0.7,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                return new THREE.Points(geo, mat);
            }

            // Spawn several galaxies outer perimeter along the tunnel
            for (let i = 0; i < 12; i++) {
                const gal = createMiniGalaxy(i % 2 === 0 ? '#ff44aa' : '#00ddff', i % 2 === 0 ? '#ffbb22' : '#aa00ff');
                const u = (i / 12);
                const pt = tunnelPath.getPointAt(u);
                
                gal.position.set(
                    pt.x + (Math.random() - 0.5) * 120,
                    pt.y + (Math.random() - 0.5) * 120,
                    pt.z + (Math.random() - 0.5) * 60
                );
                gal.rotation.x = Math.random() * Math.PI;
                gal.rotation.y = Math.random() * Math.PI;
                galaxyGroup.add(gal);
            }
            scene.add(galaxyGroup);

            let targetGyroX = 0;
            let targetGyroY = 0;
            let currentGyroX = 0;
            let currentGyroY = 0;

            let touchStartX = 0;
            let touchStartY = 0;
            let touchOffsetX = 0;
            let touchOffsetY = 0;

            function handleOrientation(event) {
                if (event.beta === null || event.gamma === null) return;
                const beta = Math.max(-60, Math.min(60, event.beta));
                const gamma = Math.max(-60, Math.min(60, event.gamma));

                targetGyroX = (beta / 60) * 0.8;
                targetGyroY = (gamma / 60) * 0.8;
            }

            function requestGyroPermission() {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            }
                        })
                        .catch(console.error);
                } else if ('addEventListener' in window) {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            }

            // Touch & Mouse Drag listener
            window.addEventListener('pointerdown', (e) => {
                requestGyroPermission();
                touchStartX = e.clientX;
                touchStartY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                if (e.buttons > 0) {
                    touchOffsetX = ((e.clientX - touchStartX) / window.innerWidth) * 2;
                    touchOffsetY = ((e.clientY - touchStartY) / window.innerHeight) * 2;
                }
            });

            window.addEventListener('pointerup', () => {
                touchOffsetX = 0;
                touchOffsetY = 0;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            });

            const clock = new THREE.Clock();
            let travelProgress = 0;
            const travelSpeed = 0.032; // Fast hyper-drive speed

            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                const elapsedTime = clock.getElapsedTime();

                // Increment travel along wormhole tube
                travelProgress += travelSpeed * delta;
                if (travelProgress >= 0.8) {
                    travelProgress -= 0.7; // Loop path seamlessly
                }

                // Camera position along curved path
                const camPos = tunnelPath.getPointAt(travelProgress);
                const lookAtPos = tunnelPath.getPointAt(travelProgress + 0.03);

                camera.position.copy(camPos);

                // Smooth Interpolation of Gyro and Touch offsets
                currentGyroX += (targetGyroX + touchOffsetY - currentGyroX) * 0.08;
                currentGyroY += (targetGyroY + touchOffsetX - currentGyroY) * 0.08;

                // Offset camera target based on tilt
                const upVector = new THREE.Vector3(0, 1, 0);
                camera.lookAt(lookAtPos);
                camera.rotation.z += elapsedTime * 0.2; // Slow tunnel roll rotation
                camera.rotation.x += currentGyroX * 0.4;
                camera.rotation.y += currentGyroY * 0.4;

                // Animate galaxies rotation
                galaxyGroup.children.forEach((gal, idx) => {
                    gal.rotation.y += 0.005 * (idx % 2 === 0 ? 1 : -1);
                });

                // Subtle pulsing tunnel lights
                tunnelMaterial.opacity = 0.12 + Math.sin(elapsedTime * 3) * 0.05;

                renderer.render(scene, camera);
            }

            // Start infinite travel animation
            animate();
        };
    </script>
</body>
</html>
