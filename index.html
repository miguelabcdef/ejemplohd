<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universe Simulation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* Glassmorphism Icon Styling */
        .glass-btn {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover, .glass-btn:active {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }
        .glass-btn.active {
            background: rgba(138, 43, 226, 0.4);
            border-color: rgba(186, 85, 211, 0.6);
            box-shadow: 0 0 15px rgba(186, 85, 211, 0.5);
        }
        /* Smooth UI Fade */
        .ui-container {
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .ui-hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="relative flex items-center justify-center w-full h-full overflow-hidden bg-black">

    <!-- Floating Minimal Textless Toolbar -->
    <div id="ui-overlay" class="ui-container fixed top-6 right-6 z-50 flex flex-col gap-3 sm:gap-4">
        <!-- Change Color Palette / Mode -->
        <button id="btn-palette" class="glass-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-white/80 text-lg sm:text-xl cursor-pointer outline-none">
            <i class="fa-solid fa-palette"></i>
        </button>
        <!-- Toggle Gravity Wells / Interaction Mode -->
        <button id="btn-interact" class="glass-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-white/80 text-lg sm:text-xl cursor-pointer outline-none active">
            <i class="fa-solid fa-atom"></i>
        </button>
        <!-- Speed Up / Slow Down Simulation -->
        <button id="btn-speed" class="glass-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-white/80 text-lg sm:text-xl cursor-pointer outline-none">
            <i class="fa-solid fa-bolt"></i>
        </button>
        <!-- Reset View / Camera -->
        <button id="btn-reset" class="glass-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-white/80 text-lg sm:text-xl cursor-pointer outline-none">
            <i class="fa-solid fa-compress"></i>
        </button>
        <!-- Toggle UI Visibility -->
        <button id="btn-eye" class="glass-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-white/80 text-lg sm:text-xl cursor-pointer outline-none">
            <i class="fa-solid fa-eye-slash"></i>
        </button>
    </div>

    <!-- Hidden Unhide Icon Button (appears when UI is hidden) -->
    <button id="btn-show-ui" class="glass-btn fixed top-6 right-6 z-40 w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-white/80 text-lg sm:text-xl cursor-pointer outline-none opacity-0 pointer-events-none transition-opacity duration-300">
        <i class="fa-solid fa-eye"></i>
    </button>

    <!-- WebGL Canvas Container -->
    <div id="canvas-container" class="w-full h-full"></div>

    <script>
        window.onload = function() {
            // Check for Mobile Device to optimize particle count
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

            // Core Parameters
            const config = {
                particleCount: isMobile ? 60000 : 150000,
                nebulaCount: isMobile ? 300 : 700,
                galaxyRadius: 1800,
                branches: 4,
                spinSpeed: 0.0008,
                paletteIndex: 0,
                speedMultiplier: 1.0,
                gravityForce: 0.05
            };

            // Color Schemes (Palettes)
            const palettes = [
                // Deep Cosmos (Purple/Cyan/Blue/Gold)
                {
                    inside: new THREE.Color(0xff0055),
                    outside: new THREE.Color(0x00d2ff),
                    accent: new THREE.Color(0xffee88),
                    bg: 0x020208
                },
                // Emerald Aurora (Teal/Green/Gold)
                {
                    inside: new THREE.Color(0x00ff87),
                    outside: new THREE.Color(0x60efff),
                    accent: new THREE.Color(0xffeb3b),
                    bg: 0x010b0a
                },
                // Solar Flare (Orange/Red/Violet)
                {
                    inside: new THREE.Color(0xff4b1f),
                    outside: new THREE.Color(0xff9000),
                    accent: new THREE.Color(0xe100ff),
                    bg: 0x0c0303
                },
                // Celestial Monochrome (Ice Blue/White/Violet)
                {
                    inside: new THREE.Color(0xe0c3fc),
                    outside: new THREE.Color(0x8ec5fc),
                    accent: new THREE.Color(0xffffff),
                    bg: 0x03030f
                }
            ];

            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(palettes[0].bg, 0.00035);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 1200, 1800);

            const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(palettes[0].bg);
            container.appendChild(renderer.domElement);

            // High efficiency Procedural Glow Sprite Texture
            function createGlowTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');

                const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
                gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 64, 64);

                const texture = new THREE.Texture(canvas);
                texture.needsUpdate = true;
                return texture;
            }

            const particleTexture = createGlowTexture();

            let galaxyGeometry, galaxyMaterial, galaxyPoints;
            let nebulaGeometry, nebulaMaterial, nebulaPoints;
            
            // Arrays to keep dynamic vertex info
            let positions, colors, scales, originalPositions, velocities;

            function buildUniverse() {
                if (galaxyPoints) scene.remove(galaxyPoints);
                if (nebulaPoints) scene.remove(nebulaPoints);

                const currentPalette = palettes[config.paletteIndex];
                scene.fog.color.setHex(currentPalette.bg);
                renderer.setClearColor(currentPalette.bg);

                // --- 1. Main Starfield Galaxy ---
                galaxyGeometry = new THREE.BufferGeometry();
                positions = new Float32Array(config.particleCount * 3);
                colors = new Float32Array(config.particleCount * 3);
                scales = new Float32Array(config.particleCount);
                originalPositions = new Float32Array(config.particleCount * 3);
                velocities = new Float32Array(config.particleCount * 3);

                for (let i = 0; i < config.particleCount; i++) {
                    const i3 = i * 3;

                    // Spiral galaxy distribution math
                    const radius = Math.random() * config.galaxyRadius;
                    const spinAngle = radius * 0.0012;
                    const branchAngle = ((i % config.branches) / config.branches) * Math.PI * 2;

                    const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * (radius * 0.2);
                    const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * (radius * 0.2);
                    const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * (radius * 0.2);

                    const x = Math.cos(branchAngle + spinAngle) * radius + randomX;
                    const y = randomY;
                    const z = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                    positions[i3] = x;
                    positions[i3 + 1] = y;
                    positions[i3 + 2] = z;

                    originalPositions[i3] = x;
                    originalPositions[i3 + 1] = y;
                    originalPositions[i3 + 2] = z;

                    velocities[i3] = 0;
                    velocities[i3 + 1] = 0;
                    velocities[i3 + 2] = 0;

                    // Color mix calculation based on radial distance
                    const mixedColor = currentPalette.inside.clone();
                    const ratio = radius / config.galaxyRadius;
                    
                    if (Math.random() > 0.9) {
                        mixedColor.lerp(currentPalette.accent, Math.random());
                    } else {
                        mixedColor.lerp(currentPalette.outside, ratio);
                    }

                    colors[i3] = mixedColor.r;
                    colors[i3 + 1] = mixedColor.g;
                    colors[i3 + 2] = mixedColor.b;

                    // Varied star size scale
                    scales[i] = Math.random() * 8 + 2;
                }

                galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                galaxyGeometry.setAttribute('size', new THREE.BufferAttribute(scales, 1));

                // Particle Shader Material
                galaxyMaterial = new THREE.PointsMaterial({
                    size: isMobile ? 3 : 4,
                    map: particleTexture,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true
                });

                galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
                scene.add(galaxyPoints);

                // --- 2. Ambient Volumetric Nebulae ---
                nebulaGeometry = new THREE.BufferGeometry();
                const nebPositions = new Float32Array(config.nebulaCount * 3);
                const nebColors = new Float32Array(config.nebulaCount * 3);

                for (let i = 0; i < config.nebulaCount; i++) {
                    const i3 = i * 3;
                    const radius = Math.random() * (config.galaxyRadius * 1.2);
                    const angle = Math.random() * Math.PI * 2;

                    nebPositions[i3] = Math.cos(angle) * radius + (Math.random() - 0.5) * 300;
                    nebPositions[i3 + 1] = (Math.random() - 0.5) * 200;
                    nebPositions[i3 + 2] = Math.sin(angle) * radius + (Math.random() - 0.5) * 300;

                    const col = (i % 2 === 0) ? currentPalette.inside : currentPalette.outside;
                    nebColors[i3] = col.r;
                    nebColors[i3 + 1] = col.g;
                    nebColors[i3 + 2] = col.b;
                }

                nebulaGeometry.setAttribute('position', new THREE.BufferAttribute(nebPositions, 3));
                nebulaGeometry.setAttribute('color', new THREE.BufferAttribute(nebColors, 3));

                nebulaMaterial = new THREE.PointsMaterial({
                    size: isMobile ? 180 : 320,
                    map: particleTexture,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.12,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true
                });

                nebulaPoints = new THREE.Points(nebulaGeometry, nebulaMaterial);
                scene.add(nebulaPoints);
            }

            buildUniverse();

            // Interaction State Variables
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let targetRotationX = 0;
            let targetRotationY = 0;
            let currentRotationX = 0;
            let currentRotationY = 0;

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(-999, -999);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            let gravityPoint = null;
            let isGravityActive = false;

            // Touch & Pointer Coordinates helper
            function getPointerPos(e) {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            }

            // Pointer Down Listener
            function onPointerDown(e) {
                if (e.target.closest('#ui-overlay') || e.target.closest('#btn-show-ui')) return;
                
                isDragging = true;
                const pos = getPointerPos(e);
                previousMousePosition = pos;

                // Update Raycaster for Gravity / Ripple Effect
                const x = (pos.x / window.innerWidth) * 2 - 1;
                const y = -(pos.y / window.innerHeight) * 2 + 1;
                mouse.set(x, y);

                raycaster.setFromCamera(mouse, camera);
                const target = new THREE.Vector3();
                if (raycaster.ray.intersectPlane(plane, target)) {
                    gravityPoint = target;
                    isGravityActive = true;
                }
            }

            // Pointer Move Listener
            function onPointerMove(e) {
                const pos = getPointerPos(e);

                if (isDragging) {
                    const deltaX = pos.x - previousMousePosition.x;
                    const deltaY = pos.y - previousMousePosition.y;

                    targetRotationY += deltaX * 0.003;
                    targetRotationX += deltaY * 0.003;

                    // Clamp pitch angle
                    targetRotationX = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, targetRotationX));

                    previousMousePosition = pos;
                }

                // Update active gravity well location
                if (isGravityActive) {
                    const x = (pos.x / window.innerWidth) * 2 - 1;
                    const y = -(pos.y / window.innerHeight) * 2 + 1;
                    mouse.set(x, y);

                    raycaster.setFromCamera(mouse, camera);
                    const target = new THREE.Vector3();
                    if (raycaster.ray.intersectPlane(plane, target)) {
                        gravityPoint = target;
                    }
                }
            }

            // Pointer Up Listener
            function onPointerUp() {
                isDragging = false;
                isGravityActive = false;
                gravityPoint = null;
            }

            // Pinch Zoom & Mouse Wheel handling
            let touchStartDist = 0;

            function onTouchStart(e) {
                if (e.touches.length === 2) {
                    touchStartDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                } else {
                    onPointerDown(e);
                }
            }

            function onTouchMove(e) {
                if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const delta = touchStartDist - dist;
                    camera.position.z = Math.max(500, Math.min(3500, camera.position.z + delta * 2));
                    touchStartDist = dist;
                } else {
                    onPointerMove(e);
                }
            }

            function onWheel(e) {
                e.preventDefault();
                camera.position.z = Math.max(500, Math.min(3500, camera.position.z + e.deltaY * 1.5));
            }

            // Event Binding
            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('touchstart', onTouchStart, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onPointerUp);

            window.addEventListener('wheel', onWheel, { passive: false });

            // UI Button Logic
            const btnPalette = document.getElementById('btn-palette');
            const btnInteract = document.getElementById('btn-interact');
            const btnSpeed = document.getElementById('btn-speed');
            const btnReset = document.getElementById('btn-reset');
            const btnEye = document.getElementById('btn-eye');
            const btnShowUi = document.getElementById('btn-show-ui');
            const uiOverlay = document.getElementById('ui-overlay');

            btnPalette.addEventListener('click', () => {
                config.paletteIndex = (config.paletteIndex + 1) % palettes.length;
                buildUniverse();
            });

            btnInteract.addEventListener('click', () => {
                btnInteract.classList.toggle('active');
                config.gravityForce = btnInteract.classList.contains('active') ? 0.05 : -0.05;
            });

            btnSpeed.addEventListener('click', () => {
                if (config.speedMultiplier === 1.0) {
                    config.speedMultiplier = 2.5;
                    btnSpeed.classList.add('active');
                } else if (config.speedMultiplier === 2.5) {
                    config.speedMultiplier = 0.3;
                    btnSpeed.classList.remove('active');
                } else {
                    config.speedMultiplier = 1.0;
                }
            });

            btnReset.addEventListener('click', () => {
                targetRotationX = 0;
                targetRotationY = 0;
                camera.position.set(0, 1200, 1800);
            });

            btnEye.addEventListener('click', () => {
                uiOverlay.classList.add('ui-hidden');
                btnShowUi.classList.remove('opacity-0', 'pointer-events-none');
            });

            btnShowUi.addEventListener('click', () => {
                uiOverlay.classList.remove('ui-hidden');
                btnShowUi.classList.add('opacity-0', 'pointer-events-none');
            });

            // Window Resize handling
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                const posArr = galaxyGeometry.attributes.position.array;

                // 1. Smooth Camera Inertia
                currentRotationX += (targetRotationX - currentRotationX) * 0.05;
                currentRotationY += (targetRotationY - currentRotationY) * 0.05;

                // Position camera based on smooth rotations
                const radius = Math.sqrt(camera.position.x * camera.position.x + camera.position.z * camera.position.z);
                
                galaxyPoints.rotation.y += config.spinSpeed * config.speedMultiplier;
                nebulaPoints.rotation.y += config.spinSpeed * 0.5 * config.speedMultiplier;

                // 2. Real-time Dynamic Particle Displacement & Gravity Simulation
                for (let i = 0; i < config.particleCount; i++) {
                    const i3 = i * 3;

                    let px = posArr[i3];
                    let py = posArr[i3 + 1];
                    let pz = posArr[i3 + 2];

                    let ox = originalPositions[i3];
                    let oy = originalPositions[i3 + 1];
                    let oz = originalPositions[i3 + 2];

                    // Elastic restoration towards original spiral layout
                    velocities[i3] += (ox - px) * 0.005;
                    velocities[i3 + 1] += (oy - py) * 0.005;
                    velocities[i3 + 2] += (oz - pz) * 0.005;

                    // Active Gravity / Ripple Well effect from user input
                    if (isGravityActive && gravityPoint) {
                        const dx = gravityPoint.x - px;
                        const dy = gravityPoint.y - py;
                        const dz = gravityPoint.z - pz;
                        const distSq = dx * dx + dy * dy + dz * dz;

                        if (distSq < 600 * 600 && distSq > 10) {
                            const force = (1 - distSq / (600 * 600)) * config.gravityForce * 80;
                            velocities[i3] += dx * force * 0.001;
                            velocities[i3 + 1] += dy * force * 0.001;
                            velocities[i3 + 2] += dz * force * 0.001;
                        }
                    }

                    // Apply damping
                    velocities[i3] *= 0.92;
                    velocities[i3 + 1] *= 0.92;
                    velocities[i3 + 2] *= 0.92;

                    // Update Position Attribute
                    posArr[i3] += velocities[i3];
                    posArr[i3 + 1] += velocities[i3 + 1];
                    posArr[i3 + 2] += velocities[i3 + 2];
                }

                galaxyGeometry.attributes.position.needsUpdate = true;

                // Camera Pitch & Y Rotation adjustment
                camera.position.x = Math.sin(currentRotationY) * 1800;
                camera.position.z = Math.cos(currentRotationY) * 1800;
                camera.position.y = Math.sin(currentRotationX) * 1800 + 800;
                camera.lookAt(0, 0, 0);

                // Render Scene
                renderer.render(scene, camera);
            }

            // Start Animation Cycle
            animate();
        };
    </script>
</body>
</html>
