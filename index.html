<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Saturno 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000003;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Carga de Three.js para renderizado 3D de alta calidad -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <script>
        window.onload = function () {
            // Escena, cámara y renderizador
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000005, 0.0003);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 150, 400);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // GROUP CONTAINER
            const solarSystemGroup = new THREE.Group();
            scene.add(solarSystemGroup);

            // 1. SOL / ESTRELLA BRILLANTE (Fuera del grupo que rota con la interacción/órbita para mantenerse quieto)
            const sunGroup = new THREE.Group();
            sunGroup.position.set(-600, 200, -500);
            scene.add(sunGroup);

            // Luz puntual potente proveniente del Sol
            const sunLight = new THREE.PointLight(0xfff5e6, 3.5, 3000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunGroup.add(sunLight);

            // Luz ambiental tenue para iluminar sutilmente las zonas oscuras
            const ambientLight = new THREE.AmbientLight(0x1a2035, 0.4);
            scene.add(ambientLight);

            // Núcleo del Sol
            const sunGeo = new THREE.SphereGeometry(65, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunGroup.add(sunMesh);

            // Resplandor del Sol (Glow Shader simple mediante Canvas Texture)
            const createGlowTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                gradient.addColorStop(0, 'rgba(255, 240, 200, 1)');
                gradient.addColorStop(0.2, 'rgba(255, 180, 80, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 100, 20, 0.3)');
                gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 256, 256);
                return new THREE.CanvasTexture(canvas);
            };

            const spriteMaterial = new THREE.SpriteMaterial({
                map: createGlowTexture(),
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            const sunGlow = new THREE.Sprite(spriteMaterial);
            sunGlow.scale.set(450, 450, 1.0);
            sunGroup.add(sunGlow);

            // 2. FONDO DE ESTRELLAS
            const starsCount = 4000;
            const starsGeo = new THREE.BufferGeometry();
            const starsPos = new Float32Array(starsCount * 3);
            const starsColors = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount; i++) {
                const i3 = i * 3;
                starsPos[i3] = (Math.random() - 0.5) * 1800;
                starsPos[i3 + 1] = (Math.random() - 0.5) * 1800;
                starsPos[i3 + 2] = (Math.random() - 0.5) * 1800;

                // Colores de estrellas de frías (azules) a cálidas (rojas/blancas)
                const colorType = Math.random();
                if (colorType > 0.8) {
                    starsColors[i3] = 0.8; starsColors[i3 + 1] = 0.9; starsColors[i3 + 2] = 1.0; // Azulado
                } else if (colorType > 0.6) {
                    starsColors[i3] = 1.0; starsColors[i3 + 1] = 0.9; starsColors[i3 + 2] = 0.7; // Amarillo cálido
                } else {
                    starsColors[i3] = 1.0; starsColors[i3 + 1] = 1.0; starsColors[i3 + 2] = 1.0; // Blanco brillante
                }
            }

            starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
            starsGeo.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));

            const starsMat = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.9
            });
            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);

            // 3. PLANETA TIPO SATURNO
            const saturnGroup = new THREE.Group();
            saturnGroup.rotation.z = 26.73 * (Math.PI / 180); // Inclinación axial de Saturno (~26.7°)
            solarSystemGroup.add(saturnGroup);

            // Generador de textura procedimental para las franjas atmosféricas de Saturno
            const createSaturnTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // Colores naturales de Saturno (beige, dorado, ocre, marrón suave)
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0.00, '#4a3b2c');
                gradient.addColorStop(0.15, '#a38f73');
                gradient.addColorStop(0.30, '#d1be9b');
                gradient.addColorStop(0.45, '#e0cfad');
                gradient.addColorStop(0.50, '#c7b38e');
                gradient.addColorStop(0.55, '#dfceac');
                gradient.addColorStop(0.70, '#b8a383');
                gradient.addColorStop(0.85, '#8c775a');
                gradient.addColorStop(1.00, '#3d3023');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Añadir franjas de ruido fino para realismo de capas gaseosas
                for (let i = 0; i < 300; i++) {
                    const y = Math.random() * canvas.height;
                    const h = Math.random() * 4 + 1;
                    const opacity = Math.random() * 0.15;
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fillRect(0, y, canvas.width, h);
                }

                return new THREE.CanvasTexture(canvas);
            };

            const planetGeo = new THREE.SphereGeometry(85, 64, 64);
            const planetMat = new THREE.MeshStandardMaterial({
                map: createSaturnTexture(),
                roughness: 0.8,
                metalness: 0.1
            });
            const planetMesh = new THREE.Mesh(planetGeo, planetMat);
            planetMesh.receiveShadow = true;
            planetMesh.castShadow = true;
            saturnGroup.add(planetMesh);

            // Atmosphere Glow
            const atmosphereGeo = new THREE.SphereGeometry(86.5, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({
                color: 0xc4b28d,
                transparent: true,
                opacity: 0.08,
                side: THREE.BackSide
            });
            const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
            saturnGroup.add(atmosphere);

            // 4. INMENSOS ANILLOS DE PARTÍCULAS COLORIDAS
            const particleCount = 140000;
            const ringGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);

            const innerRadius = 110;
            const outerRadius = 320;

            // Paleta de colores normales/naturales con tonos dorados, marrones, grises y crema
            const ringColorsPalette = [
                new THREE.Color(0xd9c5a0), // Crema
                new THREE.Color(0xb59e79), // Ocre suave
                new THREE.Color(0x8c7758), // Marrón arcilla
                new THREE.Color(0xe6d7bc), // Beige claro
                new THREE.Color(0x6b5d47), // Marrón oscuro
                new THREE.Color(0xa3a398)  // Gris polvo helado
            ];

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                // Distribución con divisiones (Gaps tipo Cassini)
                let radius = innerRadius + Math.random() * (outerRadius - innerRadius);
                
                // Forzar división Cassini
                if (radius > 195 && radius < 210 && Math.random() > 0.15) {
                    radius += (Math.random() > 0.5 ? 20 : -20);
                }

                const angle = Math.random() * Math.PI * 2;
                
                // Variación de altura muy pequeña para mantener perfil delgado de anillo
                const height = (Math.random() - 0.5) * (Math.random() < 0.1 ? 4.0 : 1.2);

                positions[i3] = Math.cos(angle) * radius;
                positions[i3 + 1] = height;
                positions[i3 + 2] = Math.sin(angle) * radius;

                // Selección de color según el radio (Simulando composición por franjas)
                let color;
                const normalizedRadius = (radius - innerRadius) / (outerRadius - innerRadius);

                if (normalizedRadius < 0.3) {
                    color = ringColorsPalette[0].clone().lerp(ringColorsPalette[1], Math.random());
                } else if (normalizedRadius < 0.65) {
                    color = ringColorsPalette[2].clone().lerp(ringColorsPalette[3], Math.random());
                } else if (normalizedRadius < 0.72) {
                    // Franja oscura
                    color = ringColorsPalette[4].clone();
                } else {
                    color = ringColorsPalette[3].clone().lerp(ringColorsPalette[5], Math.random());
                }

                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;

                sizes[i] = Math.random() * 1.6 + 0.6;
            }

            ringGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            ringGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Crear textura circular suave para las partículas de polvo
            const createParticleTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.5, 'rgba(255,255,255,0.5)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(16, 16, 16, 0, Math.PI * 2);
                ctx.fill();
                return new THREE.CanvasTexture(canvas);
            };

            const ringMat = new THREE.PointsMaterial({
                size: 1.2,
                vertexColors: true,
                map: createParticleTexture(),
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
                blending: THREE.NormalBlending
            });

            const ringParticles = new THREE.Points(ringGeo, ringMat);
            saturnGroup.add(ringParticles);

            // INTERACCIÓN CON EL RATÓN / TOUCH
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let targetRotationX = 0;
            let targetRotationY = 0;

            const onPointerDown = (e) => {
                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                previousMousePosition = { x: clientX, y: clientY };
            };

            const onPointerMove = (e) => {
                if (!isDragging) return;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const deltaX = clientX - previousMousePosition.x;
                const deltaY = clientY - previousMousePosition.y;

                targetRotationY += deltaX * 0.003;
                targetRotationX += deltaY * 0.003;

                // Limitar la rotación vertical para evitar inversión abrupta
                targetRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotationX));

                previousMousePosition = { x: clientX, y: clientY };
            };

            const onPointerUp = () => {
                isDragging = false;
            };

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('touchstart', onPointerDown);
            window.addEventListener('touchmove', onPointerMove);
            window.addEventListener('touchend', onPointerUp);

            // Ajuste dinámico de ventana
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // ANIMACIÓN Y RENDERIZADO
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();

                // Rotación de Saturno sobre su propio eje
                planetMesh.rotation.y = elapsedTime * 0.08;

                // Rotación suave de las partículas de los anillos de Saturno
                ringParticles.rotation.y = elapsedTime * 0.03;

                // El Sol se mantiene completamente quieto (sin rotación ni movimiento)

                // Movimiento inercial y rotación propia/órbita continua de Saturno
                solarSystemGroup.rotation.y += (targetRotationY - solarSystemGroup.rotation.y) * 0.05;
                solarSystemGroup.rotation.x += (targetRotationX - solarSystemGroup.rotation.x) * 0.05;

                // Rotación automática continua de Saturno cuando no hay interacción
                if (!isDragging) {
                    targetRotationY += 0.0012;
                }

                // Renderizar escena
                renderer.render(scene, camera);
            }

            // Iniciar ciclo de animación
            animate();
        };
    </script>
</body>
</html>
