<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariposa de Puntos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #05050d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="butterflyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('butterflyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let particles = [];
        let mouse = { x: null, y: null, radius: 100 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', () => {
            resize();
            createButterfly();
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Ecuación matemática de la mariposa de Fay
        function getButterflyPoint(t) {
            const expCosT = Math.exp(Math.cos(t));
            const cos4t = Math.cos(4 * t);
            const sin5t5 = Math.pow(Math.sin(t / 12), 5);
            
            const r = expCosT - 2 * cos4t + sin5t5;
            
            // Invertimos 'y' para que la mariposa apunte hacia arriba
            const x = r * Math.sin(t);
            const y = -r * Math.cos(t);
            
            return { x, y };
        }

        class Particle {
            constructor(baseX, baseY, size, hue) {
                this.baseX = baseX;
                this.baseY = baseY;
                this.x = baseX;
                this.y = baseY;
                this.size = size;
                this.baseHue = hue;
                this.hue = hue;
                this.alpha = Math.random() * 0.6 + 0.4;
                this.pulseSpeed = Math.random() * 0.03 + 0.01;
                this.angle = Math.random() * Math.PI * 2;
            }

            update(time) {
                // Efecto de aleteo suave y respiración
                const flap = Math.sin(time * 3) * 0.35; // Aleteo de alas
                const floatY = Math.sin(time * 1.5) * 12; // Flotación vertical
                const floatX = Math.cos(time * 1.2) * 6;  // Oscilación horizontal

                // Distancia relativa desde el centro para simular la flexión del ala
                const dxFromCenter = this.baseX - centerX;
                const distFactor = Math.abs(dxFromCenter) / (Math.min(width, height) * 0.25);

                // Aplicar aleteo (las puntas de las alas se mueven más)
                let targetX = centerX + dxFromCenter * (1 - flap * distFactor) + floatX;
                let targetY = this.baseY + floatY;

                // Interacción con el cursor/toque
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        const force = (mouse.radius - distance) / mouse.radius;
                        const angle = Math.atan2(dy, dx);
                        targetX -= Math.cos(angle) * force * 40;
                        targetY -= Math.sin(angle) * force * 40;
                    }
                }

                // Transición suave a la posición objetivo
                this.x += (targetX - this.x) * 0.1;
                this.y += (targetY - this.y) * 0.1;

                // Pulsación de brillo y tamaño
                this.angle += this.pulseSpeed;
                this.currentSize = this.size + Math.sin(this.angle) * 0.8;
                this.currentAlpha = this.alpha + Math.sin(this.angle) * 0.25;

                // Variación sutil de color dinámico
                this.hue = this.baseHue + Math.sin(time + this.baseX * 0.01) * 20;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.2, this.currentSize), 0, Math.PI * 2);
                
                // Resplandor neón/brillante
                ctx.shadowBlur = this.currentSize * 4;
                ctx.shadowColor = `hsla(${this.hue}, 90%, 65%, ${this.currentAlpha})`;
                
                ctx.fillStyle = `hsla(${this.hue}, 85%, 70%, ${this.currentAlpha})`;
                ctx.fill();
                ctx.restore();
            }
        }

        function createButterfly() {
            particles = [];
            const particleCount = Math.min(width, height) > 600 ? 2800 : 1800;
            const scale = Math.min(width, height) * 0.085;

            for (let i = 0; i < particleCount; i++) {
                // Distribución a lo largo de la curva de la mariposa con relleno interior
                const t = Math.random() * Math.PI * 12;
                const pt = getButterflyPoint(t);
                
                // Relleno interior disperso
                const spread = Math.pow(Math.random(), 1.5);
                const bx = centerX + pt.x * scale * spread;
                const by = centerY + pt.y * scale * spread;

                // Tamaño de los puntos
                const size = Math.random() * 1.8 + 0.6;

                // Paleta de colores gradiente (Púrpura, Azul, Magenta, Cian)
                const distanceFromCenter = Math.sqrt(pt.x * pt.x + pt.y * pt.y);
                const hue = 220 + (distanceFromCenter * 25) + (Math.random() * 40 - 20);

                particles.push(new Particle(bx, by, size, hue));
            }
        }

        let time = 0;

        function animate() {
            // Fondo con estela sutil para efecto suave
            ctx.fillStyle = 'rgba(5, 5, 13, 0.25)';
            ctx.fillRect(0, 0, width, height);

            time += 0.015;

            // Actualizar y dibujar cada punto
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(time);
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        // Inicialización al cargar la ventana
        window.onload = function() {
            resize();
            createButterfly();
            animate();
        };
    </script>
</body>
</html>
