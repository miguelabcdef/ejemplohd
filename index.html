<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lenticular Galaxy Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        window.onload = function () {
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0005);

            const camera = new THREE.PerspectiveCamera(
                55, 
                window.innerWidth / window.innerHeight, 
                0.1, 
                1000
            );
            
            camera.position.set(0, 20, 55);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;
            controls.minDistance = 10;
            controls.maxDistance = 150;

            let gyroEnabled = false;
            let targetGyroX = 0;
            let targetGyroY = 0;
            let currentGyroX = 0;
            let currentGyroY = 0;

            function handleOrientation(event) {
                if (event.beta === null || event.gamma === null) return;

                // Normalize beta (-180 to 180) and gamma (-90 to 90) for camera tilt offset
                const beta = Math.max(-90, Math.min(90, event.beta));   // Front-back tilt
                const gamma = Math.max(-90, Math.min(90, event.gamma)); // Left-right tilt

                targetGyroX = (beta / 90) * 0.8;  // Vertical camera tilt factor
                targetGyroY = (gamma / 90) * 0.8; // Horizontal camera tilt factor
                gyroEnabled = true;
            }

            function requestGyroPermission() {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    // iOS 13+ permission request
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            }
                        })
                        .catch(console.error);
                } else if ('addEventListener' in window) {
                    // Standard Android / Web browsers
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            }

            // Invisible full-screen gesture trigger to comply with browser permission policies
            window.addEventListener('touchstart', function initialTouchPermission() {
                requestGyroPermission();
                window.removeEventListener('touchstart', initialTouchPermission);
            }, { once: true });

            window.addEventListener('click', function initialClickPermission() {
                requestGyroPermission();
                window.removeEventListener('click', initialClickPermission);
            }, { once: true });

            function createParticleTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');

                const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.25, 'rgba(255, 255, 255, 0.85)');
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 64, 64);

                return new THREE.CanvasTexture(canvas);
            }

            const starTexture = createParticleTexture();

            const particleCount = 130000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const coreColorInner = new THREE.Color('#ffffff');
            const coreColorMid   = new THREE.Color('#ffcc77');
            const coreColorOuter = new THREE.Color('#ff9944');
            const diskColorInner = new THREE.Color('#99ccff');
            const diskColorOuter = new THREE.Color('#4477bb');
            const dustColor      = new THREE.Color('#331100');

            const maxDiskRadius = 45;
            const coreBulgeRadius = 12;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                let x, y, z;
                let color = new THREE.Color();

                const isBulge = Math.random() < 0.40;

                if (isBulge) {
                    const r = Math.pow(Math.random(), 2.5) * coreBulgeRadius;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);

                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.cos(phi) * 0.65;
                    z = r * Math.sin(phi) * Math.sin(theta);

                    const normR = r / coreBulgeRadius;
                    if (normR < 0.25) {
                        color.copy(coreColorInner).lerp(coreColorMid, normR * 4);
                    } else {
                        color.copy(coreColorMid).lerp(coreColorOuter, (normR - 0.25) * 1.33);
                    }
                } else {
                    const r = Math.pow(Math.random(), 1.2) * (maxDiskRadius - 2) + 2;
                    const theta = Math.random() * Math.PI * 2;

                    const thicknessFactor = Math.exp(-r * 0.08) * 3.5 + 0.4;
                    const h = (Math.random() - 0.5) * thicknessFactor * (Math.pow(Math.random(), 2));

                    x = Math.cos(theta) * r;
                    y = h;
                    z = Math.sin(theta) * r;

                    const normR = r / maxDiskRadius;
                    color.copy(diskColorInner).lerp(diskColorOuter, normR);

                    if (r > 12 && r < 18 && Math.abs(h) < 0.6 && Math.random() < 0.3) {
                        color.lerp(dustColor, 0.7);
                    }
                }

                color.r = Math.min(1, Math.max(0, color.r + (Math.random() - 0.5) * 0.08));
                color.g = Math.min(1, Math.max(0, color.g + (Math.random() - 0.5) * 0.08));
                color.b = Math.min(1, Math.max(0, color.b + (Math.random() - 0.5) * 0.08));

                positions[i3]     = x;
                positions[i3 + 1] = y;
                positions[i3 + 2] = z;

                colors[i3]     = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.24,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                map: starTexture,
                transparent: true,
                opacity: 0.8
            });

            const lenticularGalaxy = new THREE.Points(geometry, material);
            scene.add(lenticularGalaxy);

            const bgStarsCount = 3500;
            const bgGeometry = new THREE.BufferGeometry();
            const bgPositions = new Float32Array(bgStarsCount * 3);

            for (let i = 0; i < bgStarsCount * 3; i += 3) {
                bgPositions[i]     = (Math.random() - 0.5) * 450;
                bgPositions[i + 1] = (Math.random() - 0.5) * 450;
                bgPositions[i + 2] = (Math.random() - 0.5) * 450;
            }

            bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
            const bgMaterial = new THREE.PointsMaterial({
                size: 0.15,
                color: 0xffffff,
                transparent: true,
                opacity: 0.4,
                map: starTexture,
                blending: THREE.AdditiveBlending
            });

            const bgStars = new THREE.Points(bgGeometry, bgMaterial);
            scene.add(bgStars);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();

                // Rotate galaxy around its axis
                lenticularGalaxy.rotation.y = elapsedTime * 0.015;

                // Smoothly interpolate gyroscope offsets
                if (gyroEnabled) {
                    currentGyroX += (targetGyroX - currentGyroX) * 0.05;
                    currentGyroY += (targetGyroY - currentGyroY) * 0.05;

                    // Apply gyro tilt to scene view orientation
                    scene.rotation.x = currentGyroX;
                    scene.rotation.z = -currentGyroY;
                }

                // Update orbit controls (touch/mouse swipe + zoom)
                controls.update();

                renderer.render(scene, camera);
            }

            animate();
        };
    </script>
</body>
</html>
