<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Galaxy Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <script>
        window.onload = function () {
            // Scene creation
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0008);

            // Camera setup
            const camera = new THREE.PerspectiveCamera(
                60, 
                window.innerWidth / window.innerHeight, 
                0.1, 
                1000
            );
            
            // Initial camera distance and height
            const cameraRadius = 35;
            let cameraAngle = 0;
            camera.position.set(0, 20, cameraRadius);

            // WebGL Renderer setup
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Helper function to create a soft glowing radial particle texture
            function createParticleTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');

                const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 64, 64);

                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            const starTexture = createParticleTexture();

            const parameters = {
                count: 120000,
                size: 0.2,
                radius: 40,
                branches: 4,
                spin: 1,
                randomness: 0.5,
                power: 4,
                insideColor: '#ff7733',
                outsideColor: '#0066ff'
            };

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(parameters.count * 3);
            const colors = new Float32Array(parameters.count * 3);
            const scales = new Float32Array(parameters.count);

            const colorInside = new THREE.Color(parameters.insideColor);
            const colorOutside = new THREE.Color(parameters.outsideColor);

            for (let i = 0; i < parameters.count; i++) {
                // Position along galaxy radius
                const i3 = i * 3;
                const radius = Math.random() * parameters.radius;
                const spinAngle = radius * parameters.spin;
                const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;

                // Random offsets for cosmic distribution
                const randomX = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomY = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomZ = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                // Color interpolation based on distance from galaxy core
                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / parameters.radius);

                // Add slight hue variation to stars
                mixedColor.r += (Math.random() - 0.5) * 0.1;
                mixedColor.g += (Math.random() - 0.5) * 0.1;
                mixedColor.b += (Math.random() - 0.5) * 0.1;

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;

                // Random star sizes
                scales[i] = Math.random();
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Material using custom additive blending for bright glowing effects
            const material = new THREE.PointsMaterial({
                size: parameters.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                map: starTexture,
                transparent: true,
                opacity: 0.8
            });

            // Galaxy mesh creation
            const galaxy = new THREE.Points(geometry, material);
            scene.add(galaxy);

            const bgStarsCount = 3000;
            const bgGeometry = new THREE.BufferGeometry();
            const bgPositions = new Float32Array(bgStarsCount * 3);

            for(let i = 0; i < bgStarsCount * 3; i += 3) {
                bgPositions[i] = (Math.random() - 0.5) * 300;
                bgPositions[i+1] = (Math.random() - 0.5) * 300;
                bgPositions[i+2] = (Math.random() - 0.5) * 300;
            }

            bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
            const bgMaterial = new THREE.PointsMaterial({
                size: 0.15,
                color: 0xffffff,
                transparent: true,
                opacity: 0.5,
                map: starTexture,
                blending: THREE.AdditiveBlending
            });
            const bgStars = new THREE.Points(bgGeometry, bgMaterial);
            scene.add(bgStars);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();

                // Rotate galaxy on its axis
                galaxy.rotation.y = elapsedTime * 0.05;

                // Smooth camera orbital rotation
                cameraAngle = elapsedTime * 0.08;
                camera.position.x = Math.sin(cameraAngle) * cameraRadius;
                camera.position.z = Math.cos(cameraAngle) * cameraRadius;
                
                // Gentle camera height oscillation
                camera.position.y = Math.sin(elapsedTime * 0.1) * 8 + 12;

                // Always focus camera at galaxy center
                camera.lookAt(0, 0, 0);

                // Render scene
                renderer.render(scene, camera);
            }

            // Start animation loop
            animate();
        };
    </script>
</body>
</html>
