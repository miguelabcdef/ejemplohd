<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selva Tropical Lluviosa - Pantalla Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b07;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Full screen clean background image */
        .jungle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.92) contrast(1.05);
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        /* Canvas overlay for seamless rain particle effect */
        #rainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Subtle ambient lighting layer */
        .ambient-layer {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 15, 5, 0.45) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden cursor-pointer" id="appBody" title="Haz clic en cualquier parte para activar/pausar el sonido de lluvia">

    <!-- Fullscreen Clean Jungle Image -->
    <img 
        id="jungleImg" 
        src="watermarked_img_10813751734266691943.jpg" 
        alt="Selva Densa Lluviosa" 
        class="jungle-bg transform scale-105"
        onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=2000&q=80';"
    >

    <!-- Subtle Ambient Vignette -->
    <div class="ambient-layer"></div>

    <!-- Animated Rain Layer -->
    <canvas id="rainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        const jungleImg = document.getElementById('jungleImg');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let raindrops = [];
        const rainCount = 650; // Dense, natural rainforest rain count

        class Raindrop {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.length = Math.random() * 22 + 12;
                this.speed = Math.random() * 11 + 14;
                this.opacity = Math.random() * 0.45 + 0.15;
                this.width = Math.random() * 1.6 + 0.6;
            }

            update() {
                this.y += this.speed;
                this.x += 0.6; // Slight wind angle

                if (this.y > height) {
                    this.reset();
                    this.y = 0;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(180, 225, 205, ${this.opacity})`;
                ctx.lineWidth = this.width;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + 0.6, this.y + this.length);
                ctx.stroke();
            }
        }

        function initRain() {
            raindrops = [];
            for (let i = 0; i < rainCount; i++) {
                raindrops.push(new Raindrop());
            }
        }

        function animateRain() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < raindrops.length; i++) {
                raindrops[i].update();
                raindrops[i].draw();
            }
            requestAnimationFrame(animateRain);
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initRain();
        });

        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.008;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.008;
            jungleImg.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
        });

        let audioCtx = null;
        let isPlaying = false;
        let noiseNode = null;
        let gainNode = null;

        function createRainAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Pink noise generation for natural ambient rainforest rain
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);

            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.11;
                b6 = white * 0.115926;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            // Low-pass filter for rainforest canopy muffling
            const filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(1100, audioCtx.currentTime);

            // Master Volume
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.65, audioCtx.currentTime);

            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
        }

        // Toggle ambient sound on screen click
        document.getElementById('appBody').addEventListener('click', () => {
            if (!audioCtx) {
                createRainAudio();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!isPlaying) {
                isPlaying = true;
            } else {
                isPlaying = false;
                audioCtx.suspend();
            }
        });

        window.onload = function() {
            initRain();
            animateRain();
        };
    </script>
</body>
</html>
