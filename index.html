<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariposa Animada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px;
        }

        /* Mensaje flotante */
        .message {
            position: absolute;
            bottom: 10%;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0, 198, 255, 0.8);
            letter-spacing: 2px;
            animation: pulseText 3s infinite ease-in-out;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Contenedor principal de la mariposa */
        .butterfly-container {
            position: relative;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        /* Vuelo flotante suave */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* Estructura central */
        .butterfly {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: rotateX(50deg) rotateY(0deg) rotateZ(-30deg);
        }

        /* Cuerpo de la mariposa */
        .body {
            position: absolute;
            top: -25px;
            left: -4px;
            width: 8px;
            height: 50px;
            background: linear-gradient(to bottom, #111, #333, #111);
            border-radius: 10px;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
        }

        /* Antenas */
        .body::before, .body::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 2px;
            height: 16px;
            background: #aaa;
            border-radius: 50%;
        }
        .body::before { left: 1px; transform: rotate(-25deg); }
        .body::after { right: 1px; transform: rotate(25deg); }

        /* Alas */
        .wing {
            position: absolute;
            top: -35px;
            width: 80px;
            height: 90px;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #7f00ff);
            border-radius: 50% 50% 10% 40%;
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.5);
            opacity: 0.9;
        }

        /* Ala Izquierda y animación de aleteo */
        .wing-left {
            right: 0;
            transform-origin: right center;
            animation: flapLeft 0.5s infinite ease-in-out alternate;
        }

        /* Ala Derecha y animación de aleteo */
        .wing-right {
            left: 0;
            transform-origin: left center;
            border-radius: 50% 50% 40% 10%;
            animation: flapRight 0.5s infinite ease-in-out alternate;
        }

        @keyframes flapLeft {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(70deg); }
        }

        @keyframes flapRight {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-70deg); }
        }

        /* Partículas / Polvo de Hadas de fondo */
        .particle {
            position: absolute;
            background: rgba(0, 198, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px #00c6ff;
            animation: rise 5s linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="butterfly-container">
        <div class="butterfly">
            <div class="body"></div>
            <div class="wing wing-left"></div>
            <div class="wing wing-right"></div>
        </div>
    </div>

    <div class="message">✨ Algo hermoso para ti ✨</div>

    <script>
        // Generador de partículas de luz de fondo
        function createParticles() {
            const count = 30;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.animationDuration = `${Math.random() * 3 + 3}s`;
                
                document.body.appendChild(particle);
            }
        }

        createParticles();
    </script>
</body>
</html>
