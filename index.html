<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia Cósmica Multicolor 3D</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls para interacción panorámica -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-black overflow-hidden">

    <!-- Contenedor del Canvas WebGL -->
    <div id="webgl-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let galaxyGeometry, galaxyMaterial, galaxyPoints;
        let bgStarsPoints;

        // Configuración de la Galaxia Espiral sin geometrías esféricas en el medio
        const parameters = {
            count: 220000,           // Partículas para densidad estelar natural
            size: 0.012,
            radius: 7.0,
            branches: 5,             // Brazos espirales
            spin: 1.35,
            randomness: 0.5,
            power: 3.8,
            rotationSpeed: 0.85
        };

        // Espectro de colores deslumbrantes para los brazos estelares
        const colorPalette = [
            new THREE.Color('#ffffff'), // Blanco núcleo concentrado
            new THREE.Color('#ffda79'), // Dorado brillante
            new THREE.Color('#ff007f'), // Magenta Neón
            new THREE.Color('#9b51e0'), // Violeta Profundo
            new THREE.Color('#00f0ff'), // Cían Neón
            new THREE.Color('#00ff88'), // Verde Esmeralda
            new THREE.Color('#2f80ed')  // Azul Intenso
        ];

        function init() {
            scene = new THREE.Scene();

            // Cámara en perspectiva
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5.5, 7.5);

            // Renderizador WebGL sin geometrías auxiliares
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            
            const container = document.getElementById('webgl-container');
            container.appendChild(renderer.domElement);

            // Controles de Cámara (Ratón y Pantalla táctil)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.04;
            controls.maxDistance = 25;
            controls.minDistance = 0.5;

            const starTexture = createParticleTexture();

            createBackgroundStars();
            generatePureParticleGalaxy(starTexture);

            // Redimensionamiento dinámico
            window.addEventListener('resize', onWindowResize);

            // Bucle principal de animación
            animate();
        }

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.6, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            return new THREE.CanvasTexture(canvas);
        }

        function createBackgroundStars() {
            const count = 4500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 35 + Math.random() * 25;

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                const color = colorPalette[Math.floor(Math.random() * colorPalette.length)].clone();
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                transparent: true,
                opacity: 0.6
            });

            bgStarsPoints = new THREE.Points(geometry, material);
            scene.add(bgStarsPoints);
        }

        function generatePureParticleGalaxy(texture) {
            galaxyGeometry = new THREE.BufferGeometry();

            const positions = new Float32Array(parameters.count * 3);
            const colors = new Float32Array(parameters.count * 3);

            for (let i = 0; i < parameters.count; i++) {
                // Radio distribuido suavemente hacia el centro sin esferas
                const radius = Math.random() * parameters.radius;
                const spinAngle = radius * parameters.spin;
                const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;

                // Desviación gaussiana/potencial para dispersión orgánica
                const randomX = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomY = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomZ = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

                positions[i * 3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i * 3 + 1] = randomY;
                positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                // --- MEZCLA MULTICOLOR ---
                const normalizedRadius = radius / parameters.radius; 
                
                // Transición continua a través de la paleta
                const scaledRadius = normalizedRadius * (colorPalette.length - 1);
                const index1 = Math.floor(scaledRadius);
                const index2 = Math.min(index1 + 1, colorPalette.length - 1);
                const lerpFactor = scaledRadius - index1;

                const color1 = colorPalette[index1];
                const color2 = colorPalette[index2];
                
                const mixedColor = color1.clone().lerp(color2, lerpFactor);

                // Asignar variaciones cromáticas según el brazo
                const branchIndex = i % parameters.branches;
                if (branchIndex === 0) mixedColor.lerp(new THREE.Color('#ff007f'), 0.3);
                if (branchIndex === 1) mixedColor.lerp(new THREE.Color('#00f0ff'), 0.3);
                if (branchIndex === 2) mixedColor.lerp(new THREE.Color('#9b51e0'), 0.3);
                if (branchIndex === 3) mixedColor.lerp(new THREE.Color('#00ff88'), 0.3);

                // Destellos aleatorios para simular brillo
                const starIntensity = Math.random() * 0.15;
                colors[i * 3] = Math.min(1, mixedColor.r + starIntensity);
                colors[i * 3 + 1] = Math.min(1, mixedColor.g + starIntensity);
                colors[i * 3 + 2] = Math.min(1, mixedColor.b + starIntensity);
            }

            galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Material de Partículas con Blending Aditivo (brillo suave natural)
            galaxyMaterial = new THREE.PointsMaterial({
                size: parameters.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                map: texture,
                transparent: true,
                opacity: 0.85
            });

            galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
            scene.add(galaxyPoints);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotación suave de la masa de partículas
            if (galaxyPoints) {
                galaxyPoints.rotation.y = elapsedTime * 0.05 * parameters.rotationSpeed;
            }

            // Movimiento orbital de estrellas lejanas
            if (bgStarsPoints) {
                bgStarsPoints.rotation.y = elapsedTime * 0.002;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
