<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Planeta Saturno 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000003;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <script>
        window.onload = function () {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000005, 0.0003);

            // Pivote de la cámara para la rotación lenta del espacio
            const cameraPivot = new THREE.Group();
            scene.add(cameraPivot);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
            
            let currentCameraDistance = isMobile ? 620 : 500;
            camera.position.set(0, 140, currentCameraDistance);
            cameraPivot.add(camera);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
            renderer.shadowMap.enabled = !isMobile;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const sunGroup = new THREE.Group();
            sunGroup.position.set(-750, 280, -650);
            scene.add(sunGroup);

            const sunLight = new THREE.PointLight(0xfff5e6, isMobile ? 3.2 : 3.8, 4500);
            sunLight.castShadow = !isMobile;
            if (!isMobile) {
                sunLight.shadow.mapSize.width = 1024;
                sunLight.shadow.mapSize.height = 1024;
            }
            sunGroup.add(sunLight);

            const ambientLight = new THREE.AmbientLight(0x1c2338, 0.5);
            scene.add(ambientLight);

            const sunGeo = new THREE.SphereGeometry(75, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunGroup.add(sunMesh);

            const createGlowTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                gradient.addColorStop(0, 'rgba(255, 240, 200, 1)');
                gradient.addColorStop(0.2, 'rgba(255, 180, 80, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 100, 20, 0.3)');
                gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 128, 128);
                return new THREE.CanvasTexture(canvas);
            };

            const spriteMaterial = new THREE.SpriteMaterial({
                map: createGlowTexture(),
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            const sunGlow = new THREE.Sprite(spriteMaterial);
            sunGlow.scale.set(550, 550, 1.0);
            sunGroup.add(sunGlow);

            const starsCount = isMobile ? 2500 : 5000;
            const starsGeo = new THREE.BufferGeometry();
            const starsPos = new Float32Array(starsCount * 3);
            const starsColors = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount; i++) {
                const i3 = i * 3;
                starsPos[i3] = (Math.random() - 0.5) * 2600;
                starsPos[i3 + 1] = (Math.random() - 0.5) * 2600;
                starsPos[i3 + 2] = (Math.random() - 0.5) * 2600;

                const colorType = Math.random();
                if (colorType > 0.8) {
                    starsColors[i3] = 0.8; starsColors[i3 + 1] = 0.9; starsColors[i3 + 2] = 1.0;
                } else if (colorType > 0.6) {
                    starsColors[i3] = 1.0; starsColors[i3 + 1] = 0.9; starsColors[i3 + 2] = 0.7;
                } else {
                    starsColors[i3] = 1.0; starsColors[i3 + 1] = 1.0; starsColors[i3 + 2] = 1.0;
                }
            }

            starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
            starsGeo.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));

            const starsMat = new THREE.PointsMaterial({
                size: isMobile ? 1.8 : 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.9
            });
            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);

            const saturnSystem = new THREE.Group();
            scene.add(saturnSystem);

            const saturnGroup = new THREE.Group();
            saturnGroup.rotation.z = 26.73 * (Math.PI / 180);
            saturnSystem.add(saturnGroup);

            const createSaturnTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0.00, '#4a3b2c');
                gradient.addColorStop(0.15, '#a38f73');
                gradient.addColorStop(0.30, '#d1be9b');
                gradient.addColorStop(0.45, '#e0cfad');
                gradient.addColorStop(0.50, '#c7b38e');
                gradient.addColorStop(0.55, '#dfceac');
                gradient.addColorStop(0.70, '#b8a383');
                gradient.addColorStop(0.85, '#8c775a');
                gradient.addColorStop(1.00, '#3d3023');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < 180; i++) {
                    const y = Math.random() * canvas.height;
                    const h = Math.random() * 3 + 1;
                    const opacity = Math.random() * 0.15;
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fillRect(0, y, canvas.width, h);
                }

                return new THREE.CanvasTexture(canvas);
            };

            const planetGeo = new THREE.SphereGeometry(85, isMobile ? 48 : 64, isMobile ? 48 : 64);
            const planetMat = new THREE.MeshStandardMaterial({
                map: createSaturnTexture(),
                roughness: 0.8,
                metalness: 0.1
            });
            const planetMesh = new THREE.Mesh(planetGeo, planetMat);
            planetMesh.receiveShadow = !isMobile;
            planetMesh.castShadow = !isMobile;
            saturnGroup.add(planetMesh);

            const particleCount = isMobile ? 35000 : 100000;
            const ringGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const innerRadius = 110;
            const outerRadius = 320;

            const ringColorsPalette = [
                new THREE.Color(0xd9c5a0),
                new THREE.Color(0xb59e79),
                new THREE.Color(0x8c7758),
                new THREE.Color(0xe6d7bc),
                new THREE.Color(0x6b5d47),
                new THREE.Color(0xa3a398)
            ];

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                let radius = innerRadius + Math.random() * (outerRadius - innerRadius);

                if (radius > 195 && radius < 210 && Math.random() > 0.15) {
                    radius += (Math.random() > 0.5 ? 20 : -20);
                }

                const angle = Math.random() * Math.PI * 2;
                const height = (Math.random() - 0.5) * (Math.random() < 0.1 ? 3.5 : 1.0);

                positions[i3] = Math.cos(angle) * radius;
                positions[i3 + 1] = height;
                positions[i3 + 2] = Math.sin(angle) * radius;

                let color;
                const normalizedRadius = (radius - innerRadius) / (outerRadius - innerRadius);

                if (normalizedRadius < 0.3) {
                    color = ringColorsPalette[0].clone().lerp(ringColorsPalette[1], Math.random());
                } else if (normalizedRadius < 0.65) {
                    color = ringColorsPalette[2].clone().lerp(ringColorsPalette[3], Math.random());
                } else if (normalizedRadius < 0.72) {
                    color = ringColorsPalette[4].clone();
                } else {
                    color = ringColorsPalette[3].clone().lerp(ringColorsPalette[5], Math.random());
                }

                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
            }

            ringGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            ringGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const createParticleTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 16;
                canvas.height = 16;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.5, 'rgba(255,255,255,0.5)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(8, 8, 8, 0, Math.PI * 2);
                ctx.fill();
                return new THREE.CanvasTexture(canvas);
            };

            const ringMat = new THREE.PointsMaterial({
                size: isMobile ? 1.6 : 1.2,
                vertexColors: true,
                map: createParticleTexture(),
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
                blending: THREE.NormalBlending
            });

            const ringParticles = new THREE.Points(ringGeo, ringMat);
            saturnGroup.add(ringParticles);

            const ringHitGeo = new THREE.RingGeometry(innerRadius, outerRadius, 32);
            const ringHitMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
            const ringHitMesh = new THREE.Mesh(ringHitGeo, ringHitMat);
            ringHitMesh.rotation.x = Math.PI / 2;
            saturnGroup.add(ringHitMesh);

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            let isDragging = false;
            let targetMode = null;
            let previousMousePosition = { x: 0, y: 0 };

            let initialPinchDistance = 0;
            let isPinching = false;

            let saturnTargetRotationY = 0;
            let saturnTargetRotationX = 0;

            let cameraTargetRotationY = 0;
            let cameraTargetRotationX = 0;

            const interactiveObjects = [planetMesh, ringHitMesh];

            const getTouchDistance = (e) => {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            };

            const onPointerDown = (e) => {
                if (e.touches && e.touches.length === 2) {
                    isPinching = true;
                    isDragging = false;
                    initialPinchDistance = getTouchDistance(e);
                    return;
                }

                if (e.touches && e.touches.length > 2) return;

                isDragging = true;
                isPinching = false;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                previousMousePosition = { x: clientX, y: clientY };

                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);

                if (intersects.length > 0) {
                    targetMode = 'planet';
                } else {
                    targetMode = 'camera';
                }
            };

            const onPointerMove = (e) => {
                if (isPinching && e.touches && e.touches.length === 2) {
                    const currentDistance = getTouchDistance(e);
                    const deltaDistance = initialPinchDistance - currentDistance;
                    
                    currentCameraDistance += deltaDistance * 0.4;
                    currentCameraDistance = Math.max(250, Math.min(1200, currentCameraDistance));
                    
                    initialPinchDistance = currentDistance;
                    return;
                }

                if (!isDragging) return;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const deltaX = clientX - previousMousePosition.x;
                const deltaY = clientY - previousMousePosition.y;

                if (targetMode === 'planet') {
                    saturnTargetRotationY += deltaX * 0.005;
                    saturnTargetRotationX += deltaY * 0.005;
                    saturnTargetRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, saturnTargetRotationX));
                } else if (targetMode === 'camera') {
                    // Control de cámara ultra lento y suave
                    cameraTargetRotationY -= deltaX * 0.0012;
                    cameraTargetRotationX -= deltaY * 0.0012;
                    cameraTargetRotationX = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, cameraTargetRotationX));
                }

                previousMousePosition = { x: clientX, y: clientY };
            };

            const onPointerUp = (e) => {
                if (e.touches && e.touches.length === 1) {
                    isPinching = false;
                    isDragging = false;
                    return;
                }
                isDragging = false;
                isPinching = false;
                targetMode = null;
            };

            const onWheel = (e) => {
                currentCameraDistance += e.deltaY * 0.3;
                currentCameraDistance = Math.max(250, Math.min(1200, currentCameraDistance));
            };

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('wheel', onWheel, { passive: true });

            window.addEventListener('touchstart', onPointerDown, { passive: false });
            window.addEventListener('touchmove', onPointerMove, { passive: false });
            window.addEventListener('touchend', onPointerUp, { passive: false });
            window.addEventListener('touchcancel', onPointerUp, { passive: false });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();

                // Rotación propia del planeta y anillos
                planetMesh.rotation.y = elapsedTime * 0.08;
                ringParticles.rotation.y = elapsedTime * 0.03;

                // Rotación suave del planeta al arrastrarlo
                saturnGroup.rotation.y += (saturnTargetRotationY - saturnGroup.rotation.y) * 0.05;
                saturnGroup.rotation.x += (saturnTargetRotationX - saturnGroup.rotation.x) * 0.05;

                if (!isDragging || targetMode !== 'planet') {
                    saturnTargetRotationY += 0.0012;
                }

                // Desplazamiento panorámico automático y muy lento de la cámara cuando no se arrastra
                if (!isDragging || targetMode !== 'camera') {
                    cameraTargetRotationY += 0.00025;
                }

                // Amortiguación/Lerp muy suave y pausado para la cámara (Factor 0.02)
                cameraPivot.rotation.y += (cameraTargetRotationY - cameraPivot.rotation.y) * 0.02;
                cameraPivot.rotation.x += (cameraTargetRotationX - cameraPivot.rotation.x) * 0.02;

                // Zoom ultra pausado
                camera.position.z += (currentCameraDistance - camera.position.z) * 0.03;

                renderer.render(scene, camera);
            }

            animate();
        };
    </script>
</body>
</html>
