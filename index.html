<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Saturno 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000003;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Carga de Three.js para renderizado 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <script>
        window.onload = function () {
            // Escena, cámara y renderizador
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000005, 0.0003);

            // Grupo pivote para la cámara (permite rotar la cámara fácilmente alrededor del centro)
            const cameraPivot = new THREE.Group();
            scene.add(cameraPivot);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(0, 150, 500);
            cameraPivot.add(camera);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 1. SOL / ESTRELLA BRILLANTE ESTÁTICA
            const sunGroup = new THREE.Group();
            sunGroup.position.set(-700, 250, -600);
            scene.add(sunGroup);

            // Luz del Sol
            const sunLight = new THREE.PointLight(0xfff5e6, 3.8, 4000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunGroup.add(sunLight);

            // Luz ambiental
            const ambientLight = new THREE.AmbientLight(0x1a2035, 0.45);
            scene.add(ambientLight);

            // Núcleo del Sol
            const sunGeo = new THREE.SphereGeometry(75, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunGroup.add(sunMesh);

            // Glow del Sol
            const createGlowTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                gradient.addColorStop(0, 'rgba(255, 240, 200, 1)');
                gradient.addColorStop(0.2, 'rgba(255, 180, 80, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 100, 20, 0.3)');
                gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 256, 256);
                return new THREE.CanvasTexture(canvas);
            };

            const spriteMaterial = new THREE.SpriteMaterial({
                map: createGlowTexture(),
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            const sunGlow = new THREE.Sprite(spriteMaterial);
            sunGlow.scale.set(550, 550, 1.0);
            sunGroup.add(sunGlow);

            // 2. FONDO DE ESTRELLAS
            const starsCount = 5000;
            const starsGeo = new THREE.BufferGeometry();
            const starsPos = new Float32Array(starsCount * 3);
            const starsColors = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount; i++) {
                const i3 = i * 3;
                starsPos[i3] = (Math.random() - 0.5) * 2200;
                starsPos[i3 + 1] = (Math.random() - 0.5) * 2200;
                starsPos[i3 + 2] = (Math.random() - 0.5) * 2200;

                const colorType = Math.random();
                if (colorType > 0.8) {
                    starsColors[i3] = 0.8; starsColors[i3 + 1] = 0.9; starsColors[i3 + 2] = 1.0;
                } else if (colorType > 0.6) {
                    starsColors[i3] = 1.0; starsColors[i3 + 1] = 0.9; starsColors[i3 + 2] = 0.7;
                } else {
                    starsColors[i3] = 1.0; starsColors[i3 + 1] = 1.0; starsColors[i3 + 2] = 1.0;
                }
            }

            starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
            starsGeo.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));

            const starsMat = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.9
            });
            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);

            // 3. PLANETA SATURNO
            const saturnSystem = new THREE.Group();
            scene.add(saturnSystem);

            const saturnGroup = new THREE.Group();
            saturnGroup.rotation.z = 26.73 * (Math.PI / 180); // Inclinación axial (~26.7°)
            saturnSystem.add(saturnGroup);

            // Generador de textura procedimental de la atmósfera
            const createSaturnTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0.00, '#4a3b2c');
                gradient.addColorStop(0.15, '#a38f73');
                gradient.addColorStop(0.30, '#d1be9b');
                gradient.addColorStop(0.45, '#e0cfad');
                gradient.addColorStop(0.50, '#c7b38e');
                gradient.addColorStop(0.55, '#dfceac');
                gradient.addColorStop(0.70, '#b8a383');
                gradient.addColorStop(0.85, '#8c775a');
                gradient.addColorStop(1.00, '#3d3023');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < 300; i++) {
                    const y = Math.random() * canvas.height;
                    const h = Math.random() * 4 + 1;
                    const opacity = Math.random() * 0.15;
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fillRect(0, y, canvas.width, h);
                }

                return new THREE.CanvasTexture(canvas);
            };

            const planetGeo = new THREE.SphereGeometry(85, 64, 64);
            const planetMat = new THREE.MeshStandardMaterial({
                map: createSaturnTexture(),
                roughness: 0.8,
                metalness: 0.1
            });
            const planetMesh = new THREE.Mesh(planetGeo, planetMat);
            planetMesh.receiveShadow = true;
            planetMesh.castShadow = true;
            saturnGroup.add(planetMesh);

            // Atmósfera exterior
            const atmosphereGeo = new THREE.SphereGeometry(86.5, 64, 64);
            const atmosphereMat = new THREE.MeshBasicMaterial({
                color: 0xc4b28d,
                transparent: true,
                opacity: 0.08,
                side: THREE.BackSide
            });
            const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
            saturnGroup.add(atmosphere);

            // ANILLOS DE PARTÍCULAS
            const particleCount = 140000;
            const ringGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const innerRadius = 110;
            const outerRadius = 320;

            const ringColorsPalette = [
                new THREE.Color(0xd9c5a0),
                new THREE.Color(0xb59e79),
                new THREE.Color(0x8c7758),
                new THREE.Color(0xe6d7bc),
                new THREE.Color(0x6b5d47),
                new THREE.Color(0xa3a398)
            ];

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                let radius = innerRadius + Math.random() * (outerRadius - innerRadius);
                
                // División Cassini
                if (radius > 195 && radius < 210 && Math.random() > 0.15) {
                    radius += (Math.random() > 0.5 ? 20 : -20);
                }

                const angle = Math.random() * Math.PI * 2;
                const height = (Math.random() - 0.5) * (Math.random() < 0.1 ? 4.0 : 1.2);

                positions[i3] = Math.cos(angle) * radius;
                positions[i3 + 1] = height;
                positions[i3 + 2] = Math.sin(angle) * radius;

                let color;
                const normalizedRadius = (radius - innerRadius) / (outerRadius - innerRadius);

                if (normalizedRadius < 0.3) {
                    color = ringColorsPalette[0].clone().lerp(ringColorsPalette[1], Math.random());
                } else if (normalizedRadius < 0.65) {
                    color = ringColorsPalette[2].clone().lerp(ringColorsPalette[3], Math.random());
                } else if (normalizedRadius < 0.72) {
                    color = ringColorsPalette[4].clone();
                } else {
                    color = ringColorsPalette[3].clone().lerp(ringColorsPalette[5], Math.random());
                }

                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
            }

            ringGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            ringGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const createParticleTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.5, 'rgba(255,255,255,0.5)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(16, 16, 16, 0, Math.PI * 2);
                ctx.fill();
                return new THREE.CanvasTexture(canvas);
            };

            const ringMat = new THREE.PointsMaterial({
                size: 1.2,
                vertexColors: true,
                map: createParticleTexture(),
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
                blending: THREE.NormalBlending
            });

            const ringParticles = new THREE.Points(ringGeo, ringMat);
            saturnGroup.add(ringParticles);

            // Malla invisible para detectar clics precisos sobre la zona de los anillos con Raycaster
            const ringHitGeo = new THREE.RingGeometry(innerRadius, outerRadius, 32);
            const ringHitMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
            const ringHitMesh = new THREE.Mesh(ringHitGeo, ringHitMat);
            ringHitMesh.rotation.x = Math.PI / 2;
            saturnGroup.add(ringHitMesh);

            // 4. RAYCASTER E INTERACCIÓN DIFERENCIADA
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            let isDragging = false;
            let targetMode = null; // 'planet' o 'camera'
            let previousMousePosition = { x: 0, y: 0 };

            // Objetos para rotación de Saturno y de la Cámara
            let saturnTargetRotationY = 0;
            let saturnTargetRotationX = 0;

            let cameraTargetRotationY = 0;
            let cameraTargetRotationX = 0;

            const interactiveObjects = [planetMesh, ringHitMesh];

            const getPointerPosition = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX, y: clientY };
            };

            const onPointerDown = (e) => {
                isDragging = true;
                const pos = getPointerPosition(e);
                previousMousePosition = pos;

                // Convertir posición del puntero a coordenadas Normalizadas (-1 a +1)
                mouse.x = (pos.x / window.innerWidth) * 2 - 1;
                mouse.y = -(pos.y / window.innerHeight) * 2 + 1;

                // Lanzar Raycast
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);

                if (intersects.length > 0) {
                    // Tocó a Saturno o sus anillos -> Modo Planeta
                    targetMode = 'planet';
                } else {
                    // Tocó el espacio -> Modo Cámara
                    targetMode = 'camera';
                }
            };

            const onPointerMove = (e) => {
                if (!isDragging) return;

                const pos = getPointerPosition(e);
                const deltaX = pos.x - previousMousePosition.x;
                const deltaY = pos.y - previousMousePosition.y;

                if (targetMode === 'planet') {
                    // Solo rotar Saturno en su eje
                    saturnTargetRotationY += deltaX * 0.006;
                    saturnTargetRotationX += deltaY * 0.006;
                    saturnTargetRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, saturnTargetRotationX));
                } else if (targetMode === 'camera') {
                    // Rotar la Cámara alrededor de la escena
                    cameraTargetRotationY -= deltaX * 0.003;
                    cameraTargetRotationX -= deltaY * 0.003;
                    cameraTargetRotationX = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, cameraTargetRotationX));
                }

                previousMousePosition = pos;
            };

            const onPointerUp = () => {
                isDragging = false;
                targetMode = null;
            };

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('touchstart', onPointerDown, { passive: true });
            window.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 5. CICLO DE ANIMACIÓN
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();

                // Rotación continua autómata sobre el eje de Saturno
                planetMesh.rotation.y = elapsedTime * 0.08;
                ringParticles.rotation.y = elapsedTime * 0.03;

                // Aplicar movimiento inercial a Saturno cuando se interactúa con él
                saturnGroup.rotation.y += (saturnTargetRotationY - saturnGroup.rotation.y) * 0.08;
                saturnGroup.rotation.x += (saturnTargetRotationX - saturnGroup.rotation.x) * 0.08;

                // Rotación suave continua de Saturno cuando no hay interacción activa sobre él
                if (!isDragging || targetMode !== 'planet') {
                    saturnTargetRotationY += 0.0015;
                }

                // Aplicar movimiento suave a la Cámara cuando se arrastra el espacio
                cameraPivot.rotation.y += (cameraTargetRotationY - cameraPivot.rotation.y) * 0.05;
                cameraPivot.rotation.x += (cameraTargetRotationX - cameraPivot.rotation.x) * 0.05;

                // El Sol permanece perfectamente estático en su posición
                renderer.render(scene, camera);
            }

            animate();
        };
    </script>
</body>
</html>
